<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Portal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #4f46e5, #1e1b4b);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    .box {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    button {
      font-weight: 600;
      border-radius: 12px;
    }

    #customerPage {
      display: none;
    }
  </style>
</head>

<body>

<!-- PAGE 1 -->
<div class="box" id="homePage">
  <h1 class="mb-3">Welcome 👋</h1>
  <p class="mb-4">Manage customers in one click</p>

  <button class="btn btn-light w-100" onclick="openCustomerPage()">🚀 Get Started</button>
</div>

<!-- PAGE 2 -->
<div class="box" id="customerPage">
  <h2 class="mb-3">Customer Portal</h2>
  <hr/>

  <input type="number" class="form-control mb-2" id="cid" placeholder="Customer ID">

  <input type="text" class="form-control mb-2" id="name" placeholder="Customer Name">

  <input type="text" class="form-control mb-2" id="address" placeholder="Customer Address">

  <input type="email" class="form-control mb-3" id="email" placeholder="Customer Email">
  
  <button class="btn btn-light w-100 mb-2" onclick="addCustomer()">➕ Add</button>
  <button class="btn btn-warning w-100 mb-2" onclick="fetchCustomer()">🔍 Get</button>
  <button class="btn btn-danger w-100" onclick="deleteCustomer()">🗑 Delete</button>

  <div class="mt-3 text-center" id="response"></div>

  <br>
  <button class="btn btn-secondary w-100" onclick="goBack()">⬅ Back</button>
</div>


<script>

function openCustomerPage() {
  document.getElementById("homePage").style.display = "none";
  document.getElementById("customerPage").style.display = "block";
}

function goBack() {
  document.getElementById("customerPage").style.display = "none";
  document.getElementById("homePage").style.display = "block";
}

async function addCustomer() {

  let data = {
    id: document.getElementById("cid").value,
    name: document.getElementById("name").value,
    address: document.getElementById("address").value,
    email: document.getElementById("email").value
  }

  await fetch("/customer/add", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });

  document.getElementById("response").innerHTML = `<b style="color:lime">Customer Added!</b>`;
}


async function fetchCustomer() {
  let id = document.getElementById("cid").value;

  let res = await fetch("/customer/"+id);
  let data = await res.json();

  document.getElementById("name").value = data.name;
  document.getElementById("address").value = data.address;
  document.getElementById("email").value = data.email;

  document.getElementById("response").innerHTML = `<b style="color:yellow">Customer Found!</b>`;
}


async function deleteCustomer() {
  let id = document.getElementById("cid").value;

  await fetch("/customer/"+id, { method: "DELETE" });

  document.getElementById("name").value = "";
  document.getElementById("address").value = "";
  document.getElementById("email").value = "";

  document.getElementById("response").innerHTML = `<b style="color:red">Customer Deleted!</b>`;
}

</script>

</body>
</html>
