<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .card {
            border-radius: 12px;
            border: none;
            box-shadow: rgba(50, 50, 93, 0.12) 0px 2px 6px 0px;
        }

        .btn-custom {
            border-radius: 8px;
        }

        .title {
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="container mt-5">
        <h2 class="text-center title mb-4">⭐ Customer Management Portal</h2>
        
        <div class="row">

            <!-- Add Customer -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="mb-3">Add Customer</h5>

                    <input type="number" id="id" class="form-control mb-2" placeholder="Customer ID">
                    <input type="text" id="name" class="form-control mb-2" placeholder="Customer Name">
                    <input type="text" id="address" class="form-control mb-2" placeholder="Customer Address">
                    <input type="email" id="email" class="form-control mb-2" placeholder="Customer Email">

                    <button class="btn btn-primary w-100 btn-custom" onclick="addCustomer()">
                        Add Customer
                    </button>
                </div>
            </div>

            <!-- Get Customer -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="mb-3">Find Customer</h5>

                    <input type="number" id="getId" class="form-control mb-2" placeholder="Enter ID">

                    <button class="btn btn-success w-100 btn-custom" onclick="getCustomer()">
                        Get Customer
                    </button>

                    <div id="result" class="mt-3"></div>
                </div>
            </div>

            <!-- Delete Customer -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="mb-3">Delete Customer</h5>

                    <input type="number" id="deleteId" class="form-control mb-2" placeholder="Enter ID">

                    <button class="btn btn-danger w-100 btn-custom" onclick="deleteCustomer()">
                        Delete Customer
                    </button>

                    <div id="deleteResult" class="mt-3"></div>
                </div>
            </div>

        </div>
    </div>


    <!-- JavaScript -->
    <script>
        const baseURL = "/api/customer";

        function addCustomer() {
            const customer = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                address: document.getElementById("address").value,
                email: document.getElementById("email").value
            };

            fetch(baseURL + "/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(customer)
            })
                .then(res => res.text())
                .then(data => alert(data));
        }

        function getCustomer() {
            let id = document.getElementById("getId").value;

            fetch(`${baseURL}/${id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("result").innerHTML =
                        `<b>ID:</b> ${data.id}<br>
                         <b>Name:</b> ${data.name}<br>
                         <b>Address:</b> ${data.address}<br>
                         <b>Email:</b> ${data.email}`;
                });
        }

        function deleteCustomer() {
            let id = document.getElementById("deleteId").value;

            fetch(`${baseURL}/${id}`, { method: "DELETE" })
                .then(res => res.text())
                .then(data => {
                    document.getElementById("deleteResult").innerHTML = `<b>${data}</b>`;
                });
        }
    </script>

</body>
</html>
