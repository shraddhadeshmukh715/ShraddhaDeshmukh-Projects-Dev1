<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Management</title>
<style>
body{margin:0; background:linear-gradient(135deg,#36d1dc,#5b86e5); font-family:Poppins;}
.nav{display:flex; justify-content:center; gap:20px; padding:20px;}
.nav a{background:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:600;}
.nav a:hover{background:#ffe27a; transform:scale(1.1);}
.container{width:40%; margin:30px auto; background:white; padding:30px; border-radius:15px; box-shadow:0 0 20px rgba(0,0,0,0.3);}
input,button{width:100%; padding:12px; border-radius:8px; margin-top:10px; border:1px solid #ccc;}
button{background:#5b86e5; color:white; font-weight:600;}
button:hover{background:#4668ba; transform:scale(1.05);}
#result{white-space:pre-wrap; background:#f5f5f5; padding:20px; border-radius:10px; margin-top:20px;}
h2{text-align:center;}
</style>
</head>
<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="student.html">Student</a>
    <a href="teacher.html">Teacher</a>
    <a href="library.html">Library</a>
</div>

<div class="container">
    <h2>Staff Management</h2>

    <input id="id" placeholder="ID" type="number">
    <input id="name" placeholder="Name">
    <input id="role" placeholder="Role">

    <button onclick="addData()">Add Staff</button>
    <button onclick="getAll()">Get All</button>
    <button onclick="getById()">Get By ID</button>
    <button onclick="deleteById()">Delete</button>

    <div id="result"></div>
</div>

<script>
function addData() {
    fetch("http://localhost:8080/staff", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            id:id.value,
            name:name.value,
            role:role.value
        })
    }).then(r=>r.json()).then(show);
}

function getAll(){ fetch("http://localhost:8080/staff").then(r=>r.json()).then(show); }
function getById(){ fetch("http://localhost:8080/staff/"+id.value).then(r=>r.json()).then(show); }
function deleteById(){ fetch("http://localhost:8080/staff/"+id.value,{method:"DELETE"}).then(r=>r.text()).then(show); }

function show(msg){ result.innerText = JSON.stringify(msg, null, 2); }
</script>

</body>
</html>
