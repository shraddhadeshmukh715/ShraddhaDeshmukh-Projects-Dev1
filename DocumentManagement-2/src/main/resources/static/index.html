<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <title>Document Management</title><!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script><!-- Canva SDKs -->
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
  </style>
  <script>
    // Default configuration for editable text and styling
    const defaultConfig = {
      home_title: "Document Management",
      home_subtitle: "Organize, manage and print your documents effortlessly.",
      home_description: "Use this simple tool to select a document type and send it for printing. Start by opening the Print Document workspace.",
      home_button_text: "Go to Print Document",

      print_title: "Print Document",
      print_description: "Choose the type of document you want to print and submit your request.",
      print_button_text: "Submit",

      background_color: "#0f172a",      // BACKGROUND (slate-900)
      surface_color: "#1e293b",         // SECONDARY_SURFACE (slate-800)
      text_color: "#e5e7eb",            // TEXT (gray-200)
      primary_action_color: "#38bdf8",  // PRIMARY_ACTION (sky-400)
      secondary_action_color: "#64748b",// SECONDARY_ACTION (slate-500)
      font_family: "system-ui",
      font_size: 16
    };

    // Keep references for config-driven updates
    let homeSection, printSection;
    let homeTitleEl, homeSubtitleEl, homeDescEl, homeButtonEl;
    let printTitleEl, printDescEl, printButtonEl, resultEl;
    let bodyEl, mainWrapperEl, cardHomeEl, cardPrintEl, docTypeSelectEl, navHomeBtn, navPrintBtn;

    // Initialize layout once DOM is ready
    document.addEventListener("DOMContentLoaded", () => {
      // Cache elements
      bodyEl = document.body;
      homeSection = document.getElementById("home-section");
      printSection = document.getElementById("print-section");
      homeTitleEl = document.getElementById("home-title");
      homeSubtitleEl = document.getElementById("home-subtitle");
      homeDescEl = document.getElementById("home-description");
      homeButtonEl = document.getElementById("home-button");
      printTitleEl = document.getElementById("print-title");
      printDescEl = document.getElementById("print-description");
      printButtonEl = document.getElementById("print-button");
      resultEl = document.getElementById("result");
      mainWrapperEl = document.getElementById("app-wrapper");
      cardHomeEl = document.getElementById("home-card");
      cardPrintEl = document.getElementById("print-card");
      docTypeSelectEl = document.getElementById("docType");
      navHomeBtn = document.getElementById("nav-home");
      navPrintBtn = document.getElementById("nav-print");

      // Basic navigation (no URL change)
      function showSection(section) {
        if (section === "home") {
          homeSection.classList.remove("hidden");
          printSection.classList.add("hidden");
          navHomeBtn.classList.add("bg-slate-800", "text-sky-400");
          navPrintBtn.classList.remove("bg-slate-800", "text-sky-400");
        } else {
          homeSection.classList.add("hidden");
          printSection.classList.remove("hidden");
          navPrintBtn.classList.add("bg-slate-800", "text-sky-400");
          navHomeBtn.classList.remove("bg-slate-800", "text-sky-400");
        }
      }

      navHomeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        showSection("home");
      });

      navPrintBtn.addEventListener("click", (e) => {
        e.preventDefault();
        showSection("print");
      });

      homeButtonEl.addEventListener("click", (e) => {
        e.preventDefault();
        showSection("print");
      });

      // Print submit handler
      printButtonEl.addEventListener("click", async (e) => {
        e.preventDefault();
        await printDoc();
      });

      // Initial state: show home
      showSection("home");

      // Initialize Element SDK (if available)
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            applyConfigToUI(config);
          },
          mapToCapabilities: (config) => {
            const cfg = config || defaultConfig;

            const recolorables = [
              {
                get: () => cfg.background_color || defaultConfig.background_color,
                set: (value) => {
                  window.elementSdk.config.background_color = value;
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
              {
                get: () => cfg.surface_color || defaultConfig.surface_color,
                set: (value) => {
                  window.elementSdk.config.surface_color = value;
                  window.elementSdk.setConfig({ surface_color: value });
                }
              },
              {
                get: () => cfg.text_color || defaultConfig.text_color,
                set: (value) => {
                  window.elementSdk.config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => cfg.primary_action_color || defaultConfig.primary_action_color,
                set: (value) => {
                  window.elementSdk.config.primary_action_color = value;
                  window.elementSdk.setConfig({ primary_action_color: value });
                }
              },
              {
                get: () => cfg.secondary_action_color || defaultConfig.secondary_action_color,
                set: (value) => {
                  window.elementSdk.config.secondary_action_color = value;
                  window.elementSdk.setConfig({ secondary_action_color: value });
                }
              }
            ];

            const fontEditable = {
              get: () => cfg.font_family || defaultConfig.font_family,
              set: (value) => {
                window.elementSdk.config.font_family = value;
                window.elementSdk.setConfig({ font_family: value });
              }
            };

            const fontSizeable = {
              get: () => cfg.font_size || defaultConfig.font_size,
              set: (value) => {
                window.elementSdk.config.font_size = value;
                window.elementSdk.setConfig({ font_size: value });
              }
            };

            return {
              recolorables,
              borderables: [],
              fontEditable,
              fontSizeable
            };
          },
          mapToEditPanelValues: (config) => {
            const cfg = config || defaultConfig;
            return new Map([
              ["home_title", cfg.home_title || defaultConfig.home_title],
              ["home_subtitle", cfg.home_subtitle || defaultConfig.home_subtitle],
              ["home_description", cfg.home_description || defaultConfig.home_description],
              ["home_button_text", cfg.home_button_text || defaultConfig.home_button_text],
              ["print_title", cfg.print_title || defaultConfig.print_title],
              ["print_description", cfg.print_description || defaultConfig.print_description],
              ["print_button_text", cfg.print_button_text || defaultConfig.print_button_text]
            ]);
          }
        });
      } else {
        // Fallback: apply default config if SDK is not available
        applyConfigToUI(defaultConfig);
      }
    });

    // Apply config-driven styles and text
    function applyConfigToUI(config) {
      const cfg = config || defaultConfig;

      if (!bodyEl) return;

      // Colors
      bodyEl.style.backgroundColor = cfg.background_color || defaultConfig.background_color;
      if (mainWrapperEl) {
        mainWrapperEl.style.color = cfg.text_color || defaultConfig.text_color;
        mainWrapperEl.style.fontFamily = `${cfg.font_family || defaultConfig.font_family}, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      }
      const surfaceColor = cfg.surface_color || defaultConfig.surface_color;
      const textColor = cfg.text_color || defaultConfig.text_color;
      const primaryColor = cfg.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = cfg.secondary_action_color || defaultConfig.secondary_action_color;

      if (cardHomeEl) {
        cardHomeEl.style.backgroundColor = surfaceColor;
        cardHomeEl.style.color = textColor;
      }
      if (cardPrintEl) {
        cardPrintEl.style.backgroundColor = surfaceColor;
        cardPrintEl.style.color = textColor;
      }

      if (homeButtonEl) {
        homeButtonEl.style.backgroundColor = primaryColor;
        homeButtonEl.style.borderColor = primaryColor;
        homeButtonEl.style.color = "#0f172a";
      }

      if (printButtonEl) {
        printButtonEl.style.backgroundColor = primaryColor;
        printButtonEl.style.borderColor = primaryColor;
        printButtonEl.style.color = "#0f172a";
      }

      if (navHomeBtn) {
        navHomeBtn.style.color = textColor;
      }
      if (navPrintBtn) {
        navPrintBtn.style.color = textColor;
      }

      if (docTypeSelectEl) {
        docTypeSelectEl.style.backgroundColor = "#020617";
        docTypeSelectEl.style.color = textColor;
        docTypeSelectEl.style.borderColor = secondaryColor;
      }

      // Typography scaling
      const baseSize = Number(cfg.font_size || defaultConfig.font_size) || 16;
      if (homeTitleEl) homeTitleEl.style.fontSize = baseSize * 2 + "px";
      if (homeSubtitleEl) homeSubtitleEl.style.fontSize = baseSize * 1.2 + "px";
      if (homeDescEl) homeDescEl.style.fontSize = baseSize + "px";
      if (printTitleEl) printTitleEl.style.fontSize = baseSize * 1.6 + "px";
      if (printDescEl) printDescEl.style.fontSize = baseSize + "px";
      if (resultEl) resultEl.style.fontSize = baseSize * 0.9 + "px";
      if (homeButtonEl) homeButtonEl.style.fontSize = baseSize * 0.95 + "px";
      if (printButtonEl) printButtonEl.style.fontSize = baseSize * 0.95 + "px";
      if (navHomeBtn) navHomeBtn.style.fontSize = baseSize * 0.9 + "px";
      if (navPrintBtn) navPrintBtn.style.fontSize = baseSize * 0.9 + "px";

      // Text content
      if (homeTitleEl) homeTitleEl.textContent = cfg.home_title || defaultConfig.home_title;
      if (homeSubtitleEl) homeSubtitleEl.textContent = cfg.home_subtitle || defaultConfig.home_subtitle;
      if (homeDescEl) homeDescEl.textContent = cfg.home_description || defaultConfig.home_description;
      if (homeButtonEl) homeButtonEl.textContent = cfg.home_button_text || defaultConfig.home_button_text;

      if (printTitleEl) printTitleEl.textContent = cfg.print_title || defaultConfig.print_title;
      if (printDescEl) printDescEl.textContent = cfg.print_description || defaultConfig.print_description;
      if (printButtonEl) printButtonEl.textContent = cfg.print_button_text || defaultConfig.print_button_text;
    }

    // Print document simulation (since /print/ endpoint doesn't exist in this environment)
    async function printDoc() {
      if (!docTypeSelectEl || !resultEl || !printButtonEl) return;

      const type = docTypeSelectEl.value;
      const originalText = printButtonEl.textContent;
      printButtonEl.disabled = true;
      printButtonEl.textContent = "Processing...";
      resultEl.textContent = "";

      // Simulate processing delay
      await new Promise(resolve => setTimeout(resolve, 800));

      // Show success message (simulated response)
      const timestamp = new Date().toLocaleTimeString();
      resultEl.textContent = `✓ Success: ${type.toUpperCase()} document queued for printing at ${timestamp}`;
      resultEl.style.color = "#4ade80"; // green success color

      printButtonEl.disabled = false;
      printButtonEl.textContent = originalText;

      // Note: In a real application, you would connect this to your actual backend endpoint:
      // const response = await fetch("/print/" + type);
      // const data = await response.text();
      // resultEl.textContent = "Response: " + data;
    }
  </script>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="w-full h-full">
  <div id="app-wrapper" class="w-full h-full min-h-full flex flex-col"><!-- Header -->
   <header class="w-full">
    <nav class="w-full flex items-center justify-between px-6 py-4 border-b border-slate-700 bg-slate-900/80">
     <div class="flex items-center gap-2"><!-- Simple document icon -->
      <div class="w-8 h-8 rounded-lg bg-sky-400 flex items-center justify-center"><span class="text-slate-900 text-xl font-bold">D</span>
      </div>
      <div class="flex flex-col"><span class="text-slate-100 font-semibold text-base">Document Management</span> <span class="text-slate-400 text-xs">Manage &amp; print your files</span>
      </div>
     </div>
     <div class="flex items-center gap-2"><button id="nav-home" class="px-3 py-1.5 rounded-full text-xs font-medium border border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2 focus:ring-offset-slate-900"> Home </button> <button id="nav-print" class="px-3 py-1.5 rounded-full text-xs font-medium border border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2 focus:ring-offset-slate-900"> Print </button>
     </div>
    </nav>
   </header><!-- Main content -->
   <main class="flex-1 w-full flex items-stretch justify-center">
    <div class="w-full max-w-5xl mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6"><!-- HOME SECTION -->
     <section id="home-section" class="w-full flex items-center justify-center">
      <div id="home-card" class="w-full max-w-2xl rounded-2xl border border-slate-700 shadow-xl px-8 py-12 flex flex-col items-center gap-8 text-center">
       <h1 id="home-title" class="font-semibold text-slate-100">Document Management</h1><button id="home-button" class="inline-flex items-center gap-2 px-6 py-3 rounded-full border font-medium shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2 focus:ring-offset-slate-900"> <span>Go to Print Document</span> <span class="text-lg">→</span> </button>
      </div>
     </section><!-- PRINT SECTION -->
     <section id="print-section" class="w-full hidden">
      <div id="print-card" class="w-full rounded-2xl border border-slate-700 shadow-xl px-6 py-6 flex flex-col gap-4">
       <div class="flex flex-col gap-2">
        <h2 id="print-title" class="font-semibold text-slate-100">Print Document</h2>
        <p id="print-description" class="text-slate-300 text-sm">Choose the type of document you want to print and submit your request.</p>
       </div>
       <form class="flex flex-col gap-4" aria-labelledby="print-title">
        <div class="flex flex-col gap-2"><label for="docType" class="text-sm font-medium text-slate-200"> Select Document Type </label> <select id="docType" name="docType" class="w-full rounded-lg border bg-slate-950/80 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent"> <option value="Pdf">PDF</option> <option value="word">Word</option> <option value="excel">Excel</option> </select>
        </div>
        <div class="flex items-center gap-3"><button id="print-button" type="submit" class="inline-flex items-center justify-center px-4 py-2 rounded-full border font-medium shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2 focus:ring-offset-slate-900"> Submit </button> <span class="text-xs text-slate-400">Your request will be sent to /print/&lt;type&gt;.</span>
        </div>
       </form>
       <div class="mt-3 min-h-[1.5rem]">
        <p id="result" class="text-sm text-slate-200"></p>
       </div>
      </div>
     </section>
    </div>
   </main><!-- Footer -->
   <footer class="w-full border-t border-slate-800 py-3 px-6 text-xs text-slate-500">
    <div class="max-w-5xl mx-auto flex justify-between items-center"><span>Document Management · Sample interface</span> <span>Print workspace demo</span>
    </div>
   </footer>
  </div>
